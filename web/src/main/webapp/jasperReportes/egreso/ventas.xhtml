<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<ui:define name="main">

		<h:form>

			<p:focus context="panel" />
			<p:defaultCommand target="descargar" />

			<p:panel id="panel" header="Reporte - Ventas">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-6">
							<p:outputLabel for="persClieApelliDesd" value="Apellido Desde" />
							<p:inputText id="persClieApelliDesd"
								value="#{egresoReportControl.persClieDesd.persona.apelli}"
								required="false">
								<f:validateBean for="persClieApelliDesd" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="persClieApelliHast" value="Apellido Hasta" />
							<p:inputText id="persClieApelliHast"
								value="#{egresoReportControl.persClieHast.persona.apelli}"
								required="false">
								<f:validateBean for="persClieApelliHast" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="persClieCedulaDesd"
								value="Cédula / Ruc Desde" />
							<p:inputText id="persClieCedulaDesd"
								value="#{egresoReportControl.persClieDesd.persona.cedulaRuc}"
								required="false">
								<f:validateBean for="persClieCedulaDesd" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="persClieCedulaHast"
								value="Cédula / Ruc Hasta" />
							<p:inputText id="persClieCedulaHast"
								value="#{egresoReportControl.persClieHast.persona.cedulaRuc}"
								required="false">
								<f:validateBean for="persClieCedulaHast" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="egresoFechaDesd" value="Fecha Desde" />
							<p:calendar id="egresoFechaDesd"
								value="#{egresoReportControl.egresoDesd.fechaEmis}"
								pattern="dd-MM-yyyy" required="true"
								requiredMessage="Ingrese fecha desde" />
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="egresoFechaHast" value="Fecha Hasta" />
							<p:calendar id="egresoFechaHast"
								value="#{egresoReportControl.egresoHast.fechaEmis}"
								pattern="dd-MM-yyyy" required="true"
								requiredMessage="Ingrese fecha hasta" />
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="cajaList" value="Sucursal-Caja" />
							<p:selectManyMenu id="cajaList"
								value="#{egresoReportControl.cajaIds}"
								converter="omnifaces.SelectItemsConverter" showCheckbox="true"
								required="true" requiredMessage="Seleccione caja">

								<f:selectItems value="#{egresoReportControl.cajas}" var="caja"
									itemLabel="#{caja.sucursal.descri} - #{caja.descri}"
									itemValue="#{caja.cajaId}" />

							</p:selectManyMenu>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="docuEgreList" value="Documento" />
							<p:selectManyMenu id="docuEgreList"
								value="#{egresoReportControl.docuEgreIds}"
								converter="omnifaces.SelectItemsConverter" showCheckbox="true">

								<f:selectItems value="#{egresoReportControl.docuEgres}"
									var="docuEgre" itemLabel="#{docuEgre.documento.descri}"
									itemValue="#{docuEgre.documentoId}" />

							</p:selectManyMenu>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="tipo" value="Tipo Reporte" />
							<p:selectOneMenu id="tipo"
								value="#{egresoReportControl.nombreReporte}">
								<f:selectItem itemLabel="Ventas" itemValue="ventas" />
								<f:selectItem itemLabel="Utilidad" itemValue="ventasUtil" />
								<f:selectItem itemLabel="Ventas Detalle Iva"
									itemValue="ventasIva" />
							</p:selectOneMenu>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel value="Formato" />
							<p:selectOneRadio value="#{egresoReportControl.formatoReporte}">
								<f:selectItems value="#{egresoReportControl.formatoReportes}"
									var="formatoReporte" itemValue="#{formatoReporte.descri}"
									itemLabel="#{formatoReporte.descri}" />
							</p:selectOneRadio>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="barraBotones">

				<p:commandLink id="descargar" ajax="false" styleClass="boton"
					value="Descargar" action="#{egresoReportControl.descargar}" />

				<p:link value="Cancelar" outcome="ventas" includeViewParams="false"
					styleClass="boton" />
			</div>
		</h:form>
	</ui:define>
</ui:composition>
