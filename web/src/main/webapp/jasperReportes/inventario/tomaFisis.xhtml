<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:focus context="panel" />
			<p:defaultCommand target="descargar" />

			<p:panel id="panel" header="Reporte Inventario - Toma Física">

				<div class="card ui-fluid">
					<div class="formgrid grid">
						<div class="field col-12 md:col-6">

							<p:outputLabel for="tomaFisiId" value="Número Control" />
							<p:inputText id="tomaFisiId"
								value="#{tomaFisiReportControl.tomaFisiId}" required="false">
								<f:validateBean for="tomaFisiId" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="tomaFisiNumero" value="Número" />
							<p:inputText id="tomaFisiNumero"
								value="#{tomaFisiReportControl.tomaFisiNumero}" required="false">
								<f:validateBean for="tomaFisiNumero" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel value="Formato" />
							<p:selectOneRadio value="#{tomaFisiReportControl.formatoReporte}">
								<f:selectItems value="#{tomaFisiReportControl.formatoReportes}"
									var="formatoReporte" itemValue="#{formatoReporte.descri}"
									itemLabel="#{formatoReporte.descri}" />
							</p:selectOneRadio>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="barraBotones">

				<p:commandLink id="descargar" ajax="false" styleClass="boton"
					value="Descargar" action="#{tomaFisiReportControl.descargar}" />

				<p:link value="Cancelar" outcome="tomaFisis"
					includeViewParams="false" styleClass="boton" />
			</div>
		</h:form>
	</ui:define>
</ui:composition>
