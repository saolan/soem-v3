<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:event type="preRenderView"
			listener='#{pedidoReportControl.buscarRolSucus}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:focus context="panel" />
			<p:defaultCommand target="descargar" />

			<p:panel id="panel" header="Reporte Inventario - Pedidos">

				<div class="card ui-fluid">
					<div class="formgrid grid">
						<div class="field col-12 md:col-6">

							<p:outputLabel for="productoCodigoBarraDesd"
								value="Código Barra Desde" />
							<p:inputText id="productoCodigoBarraDesd"
								value="#{pedidoReportControl.productoDesd.codigoBarra}"
								required="false" >
								<f:validateBean for="productoCodigoBarraDesd" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="productoCodigoBarraHast"
								value="Código Barra Hasta" />
							<p:inputText id="productoCodigoBarraHast"
								value="#{pedidoReportControl.productoHast.codigoBarra}"
								required="false" >
								<f:validateBean for="productoCodigoBarraHast" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="productoCodigoDesd" value="Código Desde" />
							<p:inputText id="productoCodigoDesd"
								value="#{pedidoReportControl.productoDesd.codigo}"
								required="false" >
								<f:validateBean for="productoCodigoDesd" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="productoCodigoHast" value="Código Hasta" />
							<p:inputText id="productoCodigoHast"
								value="#{pedidoReportControl.productoHast.codigo}"
								required="false" >
								<f:validateBean for="productoCodigoHast" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="productoDescriDesd" value="Descripción Desde" />
							<p:inputText id="productoDescriDesd"
								value="#{pedidoReportControl.productoDesd.descri}"
								required="false" >
								<f:validateBean for="productoDescriDesd" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="productoDescriHasta"
								value="Descripción Hasta" />
							<p:inputText id="productoDescriHasta"
								value="#{pedidoReportControl.productoHast.descri}"
								required="false" >
								<f:validateBean for="productoDescriHasta" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="sucursalList" value="Sucursal" />
							<p:selectManyMenu id="sucursalList"
								value="#{pedidoReportControl.sucursalIds}" showCheckbox="true"
								converter="omnifaces.SelectItemsConverter" 
								required="true" requiredMessage="Seleccione Sucursal">

								<f:selectItems value="#{pedidoReportControl.sucursals}"
									var="sucursal" itemLabel="#{sucursal.descri}"
									itemValue="#{sucursal.sucursalId}" />
							</p:selectManyMenu>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel value="Proveedor" />
							<p:selectManyMenu id="persProvList"
								value="#{pedidoReportControl.persProvIds}" showCheckbox="true"
								converter="omnifaces.SelectItemsConverter" >

								<f:selectItems value="#{pedidoReportControl.persProvs}"
									var="persProv"
									itemLabel="#{persProv.persona.apelli} #{persProv.persona.nombre}"
									itemValue="#{persProv.personaId}" />
							</p:selectManyMenu>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel value="Formato" />
							<p:selectOneRadio value="#{pedidoReportControl.formatoReporte}">
								<f:selectItems value="#{pedidoReportControl.formatoReportes}"
									var="formatoReporte" itemValue="#{formatoReporte.descri}"
									itemLabel="#{formatoReporte.descri}" />
							</p:selectOneRadio>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="barraBotones">

				<p:commandLink id="descargar" ajax="false" styleClass="boton"
					value="Descargar" action="#{pedidoReportControl.descargar}" />

				<p:link value="Cancelar" outcome="pedidos" includeViewParams="false"
					styleClass="boton" />
			</div>
		</h:form>
	</ui:define>
</ui:composition>
