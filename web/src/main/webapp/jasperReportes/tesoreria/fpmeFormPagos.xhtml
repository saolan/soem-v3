<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<ui:define name="main">

		<h:form>

			<p:panel id="panel" header="Reporte - Ventas Formas de Pago">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-6">
							<p:outputLabel for="persClieApelliDesd" value="Apellido Desde" />
							<p:inputText id="persClieApelliDesd"
								value="#{fpmeFormPagoReportControl.persClieDesd.persona.apelli}"
								required="false">
								<f:validateBean for="persClieApelliDesd" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="persClieApelliHast" value="Apellido Hasta" />
							<p:inputText id="persClieApelliHast"
								value="#{fpmeFormPagoReportControl.persClieHast.persona.apelli}"
								required="false">
								<f:validateBean for="persClieApelliHast" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="persClieCedulaDesd" value="Cédula Desde" />
							<p:inputText id="persClieCedulaDesd"
								value="#{fpmeFormPagoReportControl.persClieDesd.persona.cedulaRuc}"
								required="false">
								<f:validateBean for="persClieCedulaDesd" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="persClieCedulaHast" value="Cédula Hasta" />
							<p:inputText id="persClieCedulaHast"
								value="#{fpmeFormPagoReportControl.persClieHast.persona.cedulaRuc}"
								required="false">
								<f:validateBean for="persClieCedulaHast" disabled="true" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="fpmiFechaDesd" value="Fecha Desde" />
							<p:calendar id="fpmiFechaDesd"
								value="#{fpmeFormPagoReportControl.fpmeDesd.fecha}"
								pattern="dd-MM-yyyy" required="true"
								requiredMessage="Ingrese fecha desde" />
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="fpmiFechaHast" value="Fecha Hasta" />
							<p:calendar id="fpmiFechaHast"
								value="#{fpmeFormPagoReportControl.fpmeHast.fecha}"
								pattern="dd-MM-yyyy" required="true"
								requiredMessage="Ingrese fecha hasta" />
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="cajaList" value="Sucursal-Caja"
								 />
							<p:selectManyMenu id="cajaList"
								value="#{fpmeFormPagoReportControl.cajaIds}"
								converter="omnifaces.SelectItemsConverter" showCheckbox="true"
								 required="true"
								requiredMessage="Seleccione caja">

								<f:selectItems value="#{fpmeFormPagoReportControl.cajas}"
									var="caja" itemLabel="#{caja.sucursal.descri} - #{caja.descri}"
									itemValue="#{caja.cajaId}" />

							</p:selectManyMenu>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="docuEgreList" value="Documento"
								 />
							<p:selectManyMenu id="docuEgreList"
								value="#{fpmeFormPagoReportControl.docuEgreIds}"
								converter="omnifaces.SelectItemsConverter" showCheckbox="true"
								>

								<f:selectItems value="#{fpmeFormPagoReportControl.docuEgres}"
									var="docuEgre" itemLabel="#{docuEgre.documento.descri}"
									itemValue="#{docuEgre.documentoId}" />

							</p:selectManyMenu>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="formPagoList" value="Forma Pago"
								 />
							<p:selectManyMenu id="formPagoList"
								value="#{fpmeFormPagoReportControl.formPagoIds}"
								showCheckbox="true" converter="omnifaces.SelectItemsConverter"
								>

								<f:selectItems value="#{fpmeFormPagoReportControl.formPagos}"
									var="formPago" itemLabel="#{formPago.descri}"
									itemValue="#{formPago.formPagoId}" />

							</p:selectManyMenu>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="estadoList" value="Estado"  />
							<p:selectManyMenu id="estadoList"
								value="#{fpmeFormPagoReportControl.estadoDescris}"
								showCheckbox="true" converter="omnifaces.SelectItemsConverter"
								>

								<f:selectItems
									value="#{fpmeFormPagoReportControl.parametroEstados}"
									var="estado" itemLabel="#{estado.descri}"
									itemValue="#{estado.descri}" />

							</p:selectManyMenu>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="estado" value="Cliente Estado"
								 />
							<p:selectBooleanCheckbox id="estado"
								value="#{fpmeFormPagoReportControl.persClieEstado}"
								required="false">
								<f:validateBean for="estado" disabled="true" />
							</p:selectBooleanCheckbox>
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel value="Formato" />
							<p:selectOneRadio
								value="#{fpmeFormPagoReportControl.formatoReporte}">
								<f:selectItems
									value="#{fpmeFormPagoReportControl.formatoReportes}"
									var="formatoReporte" itemValue="#{formatoReporte.descri}"
									itemLabel="#{formatoReporte.descri}" />
							</p:selectOneRadio>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="barraBotones">

				<p:commandLink id="descargar" ajax="false" styleClass="boton"
					value="Descargar" action="#{fpmeFormPagoReportControl.descargar}" />

				<p:link value="Cancelar" outcome="fpmeFormPagos"
					includeViewParams="false" styleClass="boton" />

			</div>
		</h:form>
	</ui:define>
</ui:composition>
