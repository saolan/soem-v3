<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<ui:define name="main">

		<h:form>

			<p:focus context="panel" />
			<p:defaultCommand target="descargar" />

			<p:panel id="panel" header="Reporte Anexo Documentos Anulados">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-6">
							<p:outputLabel for="ingresoFechaDesd" value="Fecha Desde" />
							<p:calendar id="ingresoFechaDesd"
								value="#{anexoAnulsReportControl.ingresoDesd.fechaEmis}"
								pattern="dd-MM-yyyy" required="true"
								requiredMessage="Ingrese fecha desde" />
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel for="ingresoFechaHast" value="Fecha Hasta" />
							<p:calendar id="ingresoFechaHast"
								value="#{anexoAnulsReportControl.ingresoHast.fechaEmis}"
								pattern="dd-MM-yyyy" required="true"
								requiredMessage="Ingrese fecha hasta" />
						</div>

						<div class="field col-12 md:col-6">
							<p:outputLabel value="Formato"  />
							<p:selectOneRadio
								value="#{anexoAnulsReportControl.formatoReporte}">
								<f:selectItems
									value="#{anexoAnulsReportControl.formatoReportes}"
									var="formatoReporte" itemValue="#{formatoReporte.descri}"
									itemLabel="#{formatoReporte.descri}" />
							</p:selectOneRadio>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="barraBotones">

				<p:commandLink id="descargar" ajax="false" styleClass="boton"
					value="Descargar" action="#{anexoAnulsReportControl.descargar}" />

				<p:link value="Cancelar" outcome="anexoAnuls"
					includeViewParams="false" styleClass="boton" />

			</div>
		</h:form>
	</ui:define>
F</ui:composition>
