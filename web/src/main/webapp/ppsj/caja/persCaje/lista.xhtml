<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{persCajeControl.pagina}' />
		<f:event type="preRenderView" listener='#{persCajeControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:focus context="panelBuscar" />
			<p:defaultCommand target="buscar" />

			<div class="barraBotones">

				<p:commandLink value="Nuevo" styleClass="boton" ajax="false"
					action="#{persCajeControl.nuevo}"
					rendered="#{persCajeControl.rolPermiso.get(1000)}">
					<f:setPropertyActionListener value="/ppsj/caja/persCaje/lista"
						target="#{persCajeControl.paginaRuta}" />
				</p:commandLink>

				<p:commandLink id="buscar" ajax="false" value="Buscar"
					styleClass="boton" action="#{persCajeControl.iniciarPagina}" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>

			<p:panel id="panelBuscar" style="margin-bottom:10px"
				header="Cajero - Panel Busqueda">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="cedula"
								value="#{personaControl.persona.cedulaRuc}" required="false"
								placeholder="Cédula o Ruc">
								<f:validateBean for="cedula" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="apelli" value="#{personaControl.persona.apelli}"
								required="false" placeholder="Apellido">
								<f:validateBean for="apelli" disabled="true" />
							</p:inputText>
						</div>


						<div class="col-12 md:col-2">
							<p:inputText id="nombre" value="#{personaControl.persona.nombre}"
								required="false" placeholder="Nombre">
								<f:validateBean for="nombre" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:selectBooleanCheckbox id="estado" itemLabel="Estado"
								value="#{personaControl.persona.estado}" required="false">
								<f:validateBean for="estado" disabled="true" />
							</p:selectBooleanCheckbox>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="card product">

			<p:dataView id="persCajeList"
				emptyMessage="No se encontro datos"
				value="#{persCajeControl.persCajes}" var="_persCaje">

				<f:facet name="header">
					<h:outputText value="Cajeros" />
				</f:facet>

					<p:dataViewListItem>
						<div class="product-list-item">

							<div class="product-list-detail">#{_persCaje.persona.cedulaRuc}</div>

							<div class="product-list-detail">#{_persCaje.persona.apelli}
								#{_persCaje.persona.nombre}</div>

							<div class="product-list-detail">#{_persCaje.persona.correo}</div>

							<div class="product-list-detail">
								<h:selectBooleanCheckbox id="estado" value="#{_persCaje.estado}"
									disabled="true" />
							</div>

							<div class="product-list-action">
								<div class="link-container">
						<p:commandLink styleClass="ui-icon ui-icon-pencil"
							title="Modificar" ajax="false"
							action="#{persCajeControl.modificar}">
							<f:setPropertyActionListener value="#{_persCaje.personaId}"
								target="#{persCajeControl.id}" />
							<f:setPropertyActionListener value="/ppsj/caja/persCaje/lista"
								target="#{persCajeControl.paginaRuta}" />
						</p:commandLink>

						<p:commandLink styleClass="ui-icon ui-icon-folder-open"
							title="Explorar" ajax="false"
							action="#{persCajeControl.explorar}">
							<f:setPropertyActionListener value="#{_persCaje.personaId}"
								target="#{persCajeControl.id}" />
						</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
					
				<p:column style="width:80px;text-align: center"
					headerText="Operación">

					<p:panelGrid columns="2" styleClass="ui-noborder">


					</p:panelGrid>

				</p:column>

				<p:column headerText="Cédula">
					<h:outputText id="cedula" value="#{_persCaje.persona.cedulaRuc}" />
				</p:column>

				<p:column headerText="Apellido">
					<h:outputText id="apelli" value="#{_persCaje.persona.apelli}" />
				</p:column>

				<p:column headerText="Nombre">
					<h:outputText id="nombre" value="#{_persCaje.persona.nombre}" />
				</p:column>

				<p:column headerText="Estado">
					<h:selectBooleanCheckbox value="#{_persCaje.estado}"
						disabled="true" />
				</p:column>
			</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{persCajeControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
