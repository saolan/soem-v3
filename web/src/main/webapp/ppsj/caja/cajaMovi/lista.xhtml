<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{cajaMoviControl.pagina}' />
		<f:event type="preRenderView" listener='#{cajaMoviControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:focus context="panelBuscar" />
			<p:defaultCommand target="buscar" />

			<div class="barraBotones">

				<p:link value="Nuevo" outcome="registra" styleClass="boton"
					rendered="#{cajaMoviControl.rolPermiso.get(1100)}" />

				<p:commandLink id="buscar" value="Buscar" styleClass="boton"
					action="#{cajaMoviControl.iniciarPagina}" ajax="false" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>
			
			<p:panel id="panelBuscar" header="Movimiento Caja - Panel Busqueda">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="docume"
								value="#{cajaMoviControl.cajaMovi.docuCaja.documento.descri}"
								required="false" placeholder="Documento">
								<f:validateBean for="docume" disabled="true" />
							</p:inputText>
						</div>


						<div class="col-12 md:col-2">
							<p:inputText id="caja" placeholder="Caja"
								value="#{cajaMoviControl.cajaMovi.caja.descri}" required="false">
								<f:validateBean for="caja" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="cajero" placeholder="Cajero"
								value="#{cajaMoviControl.cajaMovi.persCaje.persona.apelli}"
								required="false">
								<f:validateBean for="cajero" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:calendar id="fecha" value="#{cajaMoviControl.cajaMovi.fecha}"
								pattern="dd-MM-yyyy" required="false" placeholder="fecha">
								<f:validateBean for="fecha" disabled="true" />
							</p:calendar>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="card product">

				<p:dataView id="cajaMoviList" emptyMessage="No se encontro datos"
					value="#{cajaMoviControl.cajaMovis}" var="_cajaMovi">

					<f:facet name="header">
						<h:outputText value="Movimientos Caja" />
					</f:facet>

					<p:dataViewListItem>
						<div class="product-list-item">

							<div class="product-list-detail">
								<span class="product-name">#{_cajaMovi.docuCaja.documento.descri} #{_cajaMovi.cajaMoviId} </span>
								<div>#{_cajaMovi.caja.descri}</div>
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Cajero: "></p:outputLabel>
								<p:outputLabel>#{_cajaMovi.persCaje.persona.apelli}
									#{_cajaMovi.persCaje.persona.nombre}</p:outputLabel>
								<div></div>
								<p:outputLabel value="Referen: "></p:outputLabel>
								<p:outputLabel class="product-name">#{_cajaMovi.cajaMovi.cajaMoviId}</p:outputLabel>

							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Emisión:" style="margin-right:7px"></p:outputLabel>
								<h:outputText id="fecha1" value="#{_cajaMovi.fecha}">
									<f:convertDateTime type="localDate" pattern="dd-MM-yyyy" />
								</h:outputText>
								<div></div>
								<p:outputLabel value="Registro:" style="margin-right:5px"></p:outputLabel>
								<h:outputText id="fechaHoraRegi1"
									value="#{_cajaMovi.fechaHoraRegi}">
									<f:convertDateTime type="localDate" pattern="dd-MM-yyyy HH:mm" />
								</h:outputText>
							</div>
							
							<div class="product-list-detail">
								<p:selectBooleanCheckbox id="estado" value="#{_cajaMovi.estado}"
									itemLabel="Estado" disabled="true" />
							</div>

							<div class="product-list-action">

								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar" action="#{cajaMoviControl.modificar}">
										<f:setPropertyActionListener value="#{_cajaMovi.cajaMoviId}"
											target="#{cajaMoviControl.id}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" action="#{cajaMoviControl.explorar}">
										<f:setPropertyActionListener value="#{_cajaMovi.cajaMoviId}"
											target="#{cajaMoviControl.id}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{cajaMoviControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
