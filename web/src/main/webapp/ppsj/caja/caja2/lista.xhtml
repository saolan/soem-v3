<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{cajaControl.pagina}' />
		<f:event type="preRenderView" listener='#{cajaControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:defaultCommand target="buscar" />

			<div class="barraBotones">

				<p:link value="Nuevo" outcome="registra" styleClass="boton"
					rendered="#{cajaControl.rolPermiso.get(1000)}" />

				<p:commandLink id="buscar" value="Buscar" styleClass="boton"
					ajax="true" action="#{cajaControl.iniciarPagina}" update="cajaList" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />

			</div>

			<p:panel id="panelBuscar" style="margin-bottom:10px"
				header="Caja - Panel Busqueda">
				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<div class="ui-inputgroup">
								<p:selectManyMenu id="sucursalList"
									value="#{cajaControl.sucursalIds}" showCheckbox="true"
									converter="omnifaces.SelectItemsConverter" required="true"
									requiredMessage="Seleccione Sucursal">

									<f:selectItems value="#{cajaControl.sucursals}" var="sucursal"
										itemLabel="#{sucursal.descri}" itemValue="#{sucursal}" />

								</p:selectManyMenu>

							</div>
						</div>

						<div class="col-12 md:col-2">
							<div class="ui-inputgroup">
								<p:inputText id="codigo" value="#{cajaControl.caja.codigo}"
									placeholder="Código" required="false">
									<f:validateBean for="descri" disabled="true" />
								</p:inputText>

							</div>
						</div>

						<div class="col-12 md:col-2">
							<div class="ui-inputgroup">
								<p:inputText id="descri" value="#{cajaControl.caja.descri}"
									placeholder="Descripción" required="false">
									<f:validateBean for="descri" disabled="true" />
								</p:inputText>

							</div>
						</div>

						<div class="col-12 md:col-2">
							<div class="ui-inputgroup">
								<p:selectBooleanCheckbox id="estado" itemLabel="Estado"
									value="#{cajaControl.caja.estado}" required="false">
									<f:validateBean for="estado" disabled="true" />
								</p:selectBooleanCheckbox>

							</div>
						</div>

					</div>
				</div>
			</p:panel>
			
			<div class="card">
				<p:dataTable id="cajaList" value="#{cajaControl.cajas}" var="_caja"
					reflow="true" emptyMessage="No se encontro datos">

					<p:column headerText="Op." style="width:80px;text-align: center">

						<div class="product-list-action">
							<div class="link-container">
								<p:commandLink styleClass="ui-icon ui-icon-pencil"
									title="Modificar" action="#{cajaControl.modificar}">
									<f:setPropertyActionListener value="#{_caja.cajaId}"
										target="#{cajaControl.id}" />
								</p:commandLink>

								<p:commandLink styleClass="ui-icon ui-icon-folder-open"
									value="Explorar" title="Explorar"
									action="#{cajaControl.explorar}">
									<f:setPropertyActionListener value="#{_caja.cajaId}"
										target="#{cajaControl.id}" />
								</p:commandLink>
							</div>
						</div>

					</p:column>

					<p:column headerText="Sucursal">
						<h:outputText id="sucursal" value="#{_caja.sucursal.descri}" />
					</p:column>

					<p:column headerText="Código">
						<h:outputText id="codigo" value="#{_caja.codigo}" />
					</p:column>

					<p:column headerText="Descripción">
						<h:outputText id="descri" value="#{_caja.descri}" />
					</p:column>

					<p:column headerText="Estado">
						<h:selectBooleanCheckbox id="estado" value="#{_caja.estado}"
							disabled="true" />
					</p:column>

				</p:dataTable>
			</div>
			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{cajaControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
