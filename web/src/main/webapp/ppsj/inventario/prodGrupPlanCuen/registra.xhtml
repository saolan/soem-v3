<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pgpcId" value='#{prodGrupPlanCuenControl.id}' />
		<f:viewParam name="prodGrupId"
			value='#{prodGrupPlanCuenControl.prodGrupId}' />
		<f:viewParam name="paginaRuta"
			value='#{prodGrupPlanCuenControl.paginaRuta}' />
		<f:event type="preRenderView"
			listener="#{prodGrupPlanCuenControl.recuperar}" />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:defaultCommand target="grabar" />
			<p:focus for="panelRegistrar" />

			<div class="barraBotones">

				<p:commandLink id="grabar" value="Grabar" styleClass="boton"
					action="#{prodGrupPlanCuenControl.grabar}"
					rendered="#{(prodGrupPlanCuenControl.id != null and prodGrupPlanCuenControl.rolPermiso.get(5001)) or 
					(prodGrupPlanCuenControl.id == null and prodGrupPlanCuenControl.rolPermiso.get(5000)) }" />

				<p:spacer height="2" />

				<p:commandLink id="eliminar" value="Eliminar" styleClass="boton"
					action="#{prodGrupPlanCuenControl.eliminar}"
					rendered="#{prodGrupPlanCuenControl.id != null and prodGrupPlanCuenControl.rolPermiso.get(5002)}" />

				<p:spacer height="2" />

				<p:commandLink id="cancelar" value="Cancelar" styleClass="boton"
					action="#{prodGrupPlanCuenControl.cancelar}" />

				<p:defaultCommand target="grabar" />
			</div>

			<p:panel id="panelRegistrar"
				header="Producto Grupo Asignación De Cuentas - Crear - Modificar">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-2">
							<p:outputLabel for="prodGrupList" value="Grupo&#160;Producto" />
							<p:selectOneMenu id="prodGrupList"
								value="#{prodGrupPlanCuenControl.prodGrupPlanCuen.prodGrup}"
								converter="omnifaces.SelectItemsConverter" required="true"
								requiredMessage="Ingrese Grupo de producto">
								<f:selectItems value="#{prodGrupPlanCuenControl.prodGrups}"
									var="prodGrup" itemLabel="#{prodGrup.descri}"
									itemValue="#{prodGrup}" />
							</p:selectOneMenu>
						</div>

						<div class="field col-12 md:col-5">
							<p:outputLabel for="planCuenList" value="Plan&#160;Cuenta" />
							<p:selectOneMenu id="planCuenList"
								value="#{prodGrupPlanCuenControl.prodGrupPlanCuen.planCuen}"
								converter="omnifaces.SelectItemsConverter" required="true"
								requiredMessage="Ingrese Cuenta">
								<f:selectItems value="#{prodGrupPlanCuenControl.planCuens}"
									var="planCuen"
									itemLabel="#{planCuen.codigo} - #{planCuen.descri}"
									itemValue="#{planCuen}" />
							</p:selectOneMenu>
						</div>

						<div class="field col-12 md:col-3">
							<p:outputLabel for="documentoId" value="Documento" />
							<p:selectOneMenu id="documentoId"
								value="#{prodGrupPlanCuenControl.prodGrupPlanCuen.documento}"
								converter="omnifaces.SelectItemsConverter" required="true"
								requiredMessage="Seleccione Documento">
								<f:selectItems value="#{prodGrupPlanCuenControl.documentos}"
									var="documento" itemLabel="#{documento.descri}"
									itemValue="#{documento}" />
							</p:selectOneMenu>
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Tipo&#160;Transacción" />
							<p:selectOneMenu id="tipoTran"
								value="#{prodGrupPlanCuenControl.prodGrupPlanCuen.tipoTran}"
								required="true" requiredMessage="Ingrese tipo transacción">
								<f:selectItems value="#{prodGrupPlanCuenControl.parametros}"
									var="parametro" itemLabel="#{parametro.descri}"
									itemValue="#{parametro.descri}" />
							</p:selectOneMenu>
						</div>
					</div>
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
