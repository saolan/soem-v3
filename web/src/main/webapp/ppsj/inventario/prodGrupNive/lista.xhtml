<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{prodGrupNiveControl.pagina}' />
		<f:event type="preRenderView" listener='#{prodGrupNiveControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:focus context="panelBuscar" />
			<p:defaultCommand target="buscar" />

			<div class="barraBotones">

				<p:link value="Nuevo" outcome="registra" styleClass="boton"
					rendered="#{prodGrupNiveControl.rolPermiso.get(5000)}" />

				<p:commandLink id="buscar" value="Buscar" styleClass="boton"
					action="#{prodGrupNiveControl.iniciarPagina}" ajax="true"
					update="prodGrupNiveList" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />

			</div>

			<p:panel id="panelBuscar"
				header="Producto Grupo Nivel - Panel Busqueda">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="descri"
								value="#{prodGrupNiveControl.prodGrupNive.descri}"
								required="false" placeholder="Descripción">
								<f:validateBean for="descri" disabled="true" />
							</p:inputText>
						</div>
					</div>
				</div>

			</p:panel>

			<div class="card product">

				<p:dataView id="prodGrupNiveList"
					emptyMessage="No se encontro datos"
					value="#{prodGrupNiveControl.prodGrupNives}" var="_prodGrupNive">

					<f:facet name="header">
						<h:outputText value="Niveles" />
					</f:facet>

					<p:dataViewListItem>
						<div class="product-list-item">

							<div class="product-list-detail">#{_prodGrupNive.descri}</div>

							<div class="product-list-detail">#{_prodGrupNive.nivel}</div>

							<div class="product-list-action">
								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar" action="#{prodGrupNiveControl.modificar}">
										<f:setPropertyActionListener
											value="#{_prodGrupNive.prodGrupNiveId}"
											target="#{prodGrupNiveControl.id}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" action="#{prodGrupNiveControl.explorar}">
										<f:setPropertyActionListener
											value="#{_prodGrupNive.prodGrupNiveId}"
											target="#{prodGrupNiveControl.id}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{prodGrupNiveControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
