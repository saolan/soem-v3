<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="prodGrupNiveId" value='#{prodGrupNiveControl.id}' />
		<f:event type="preRenderView"
			listener="#{prodGrupNiveControl.recuperar}" />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:defaultCommand target="grabar" />
			<p:focus for="panelRegistrar" />

			<div class="barraBotones">

				<p:commandLink id="grabar" value="Grabar" styleClass="boton"
					action="#{prodGrupNiveControl.grabar}"
					rendered="#{(prodGrupNiveControl.id != null and prodGrupNiveControl.rolPermiso.get(5001)) or 
					(prodGrupNiveControl.id == null and prodGrupNiveControl.rolPermiso.get(5000)) }" />

				<p:commandLink id="eliminar" value="Eliminar" styleClass="boton"
					action="#{prodGrupNiveControl.eliminar}"
					rendered="#{prodGrupNiveControl.id != null and prodGrupNiveControl.rolPermiso.get(5002)}" />

				<p:link styleClass="boton" type="link" value="Cancelar"
					outcome="lista" />
			</div>

			<p:panel id="panelRegistrar"
				header="Producto Grupo Nivel - Crear - Modificar">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-2">
							<p:outputLabel for="descripcion" value="Descripción" />
							<p:inputText id="descripcion"
								value="#{prodGrupNiveControl.prodGrupNive.descri}"
								required="true" requiredMessage="Ingrese descripción" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel for="nivel" value="Nivel" />
							<p:inputText id="nivel"
								value="#{prodGrupNiveControl.prodGrupNive.nivel}"
								required="true" requiredMessage="Ingrese nivel" />
						</div>
					</div>
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
