<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{productoControl.pagina}' />
		<f:event type="preRenderView" listener='#{productoControl.buscar}' />
	</f:metadata>

	<ui:param name="pageTitle" value="Soem - Productos Listado" />

	<ui:define name="main">

		<h:form>

			<p:focus context="panelBuscar" />
			<p:defaultCommand target="buscar" />

			<div class="barraBotones">

				<p:link value="Nuevo" outcome="registra" styleClass="boton"
					rendered="#{productoControl.rolPermiso.get(5000)}" />

				<p:commandLink id="buscar" value="Buscar" styleClass="boton"
					action="#{productoControl.iniciarPagina}" ajax="true"
					update="productoList,panelBuscar" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>

			<p:panel id="panelBuscar" header="Producto - Busqueda">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="codigoBarra"
								value="#{productoControl.producto.codigoBarra}"
								placeholder="Código barra" required="false">
								<f:validateBean for="codigoBarra" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="codigo"
								value="#{productoControl.producto.codigo}"
								placeholder="Código Compra" required="false">
								<f:validateBean for="codigo" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="descri"
								value="#{productoControl.producto.descri}"
								placeholder="Descripción" required="false">
								<f:validateBean for="descri" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:selectOneMenu id="tipoList"
								value="#{productoControl.producto.prodGrup.tipo}">
								<f:selectItems value="#{productoControl.parametros}"
									var="parametro" itemLabel="#{parametro.descri}"
									itemValue="#{parametro.descri}" />
							</p:selectOneMenu>
						</div>

						<div class="col-12 md:col-2">
							<p:selectBooleanCheckbox id="estado" itemLabel="Estado"
								value="#{productoControl.producto.estado}" required="false">
								<f:validateBean for="estado" disabled="true" />
							</p:selectBooleanCheckbox>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="card product">

				<p:dataView id="productoList" emptyMessage="No se encontro datos"
					value="#{productoControl.productos}" var="_producto">

					<f:facet name="header">
						<h:outputText value="Productos" />
					</f:facet>

					<p:dataViewListItem>

						<div class="product-list-item">

							<div class="product-list-detail">
								<span><i class="pi pi-barcode  product-category-icon" />#{_producto.codigoBarra}</span>
								<div>
									<i class="pi pi-tag product-category-icon" />#{_producto.codigo}
								</div>
							</div>

							<div class="product-list-detail">
								<div class="product-name">#{_producto.descri}</div>
								<div></div>
								<p:outputLabel value="Grupo: "></p:outputLabel>
								<p:outputLabel value="#{_producto.prodGrup.descri}">
								</p:outputLabel>
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Inventario: "></p:outputLabel>
								<p:outputLabel value="#{_producto.controStoc}">
								</p:outputLabel>
							</div>

							<div class="product-list-action">
								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar" action="#{productoControl.modificar}">
										<f:setPropertyActionListener value="#{_producto.productoId}"
											target="#{productoControl.id}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" action="#{productoControl.explorar}">
										<f:setPropertyActionListener value="#{_producto.productoId}"
											target="#{productoControl.id}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{productoControl}' />
			</ui:include>

		</h:form>
	</ui:define>

</ui:composition>
