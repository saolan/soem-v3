<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="prodCostId" value='#{prodCostControl.id}' />
		<f:viewParam name="productoId" value='#{prodCostControl.productoId}' />
		<f:viewParam name="paginaRuta" value='#{prodCostControl.paginaRuta}' />
		<f:event type="preRenderView" listener="#{prodCostControl.recuperar}" />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:focus for="panelRegistrar" />
			<p:defaultCommand target="grabar" />

			<div class="barraBotones">

				<p:commandLink id="grabar" value="Grabar" styleClass="boton"
					action="#{prodCostControl.grabar}"
					rendered="#{(prodCostControl.id != null and prodCostControl.rolPermiso.get(5001)) or 
					(prodCostControl.id == null and prodCostControl.rolPermiso.get(5000)) }" />

				<p:commandLink id="eliminar" value="Eliminar" styleClass="boton"
					action="#{prodCostControl.eliminar}"
					rendered="#{prodCostControl.id != null and prodCostControl.rolPermiso.get(5002)}" />

				<p:commandLink id="cancelar" value="Cancelar" styleClass="boton"
					action="#{prodCostControl.cancelar}" />

			</div>

			<p:panel id="panelRegistrar" header="Producto Costo - Crear - Modificar">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-4">
							<p:outputLabel for="productoList" value="Producto" />
							<p:selectOneMenu id="productoList"
								value="#{prodCostControl.prodCost.producto}"
								converter="omnifaces.SelectItemsConverter">
								<f:selectItems value="#{prodCostControl.productos}"
									var="producto" itemLabel="#{producto.descri}"
									itemValue="#{producto}" />
							</p:selectOneMenu>
						</div>

						<div class="field col-12 md:col-4">
							<p:outputLabel for="costoUlti" value="Costo Ultimo" />
							<p:inputText id="costoUlti"
								value="#{prodCostControl.prodCost.costoUlti}" required="true"
								requiredMessage="Ingrese costo último">
								<f:convertNumber pattern="#0.0000" locale="en-US" />
							</p:inputText>
						</div>

						<div class="field col-12 md:col-4">
							<p:outputLabel for="costoCont" value="Costo Conteo" />
							<p:inputText id="costoCont"
								value="#{prodCostControl.prodCost.costoCont}" required="true"
								requiredMessage="Ingrese costo conteo">
								<f:convertNumber pattern="#0.0000" locale="en-US" />
							</p:inputText>
						</div>
					</div>
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
