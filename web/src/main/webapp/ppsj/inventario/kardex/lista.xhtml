<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{kardexControl.pagina}' />
		<f:event type="preRenderView" listener='#{kardexControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:panel id="panelBuscar" style="margin-bottom:10px"
				header="Kardex - Panel Busqueda">

				<p:focus context="panelBuscar"/>

				<h:panelGrid columns="2">
				</h:panelGrid>

			</p:panel>

			<div id="barraBotones">

				<p:link value="Nuevo" outcome="registra" styleClass="boton" 
				rendered="#{kardexControl.rolPermiso.get(5000)}" />

				<p:spacer height="2" />

				<p:commandLink id="buscar" value="Buscar" styleClass="boton" action="#{kardexControl.iniciarPagina}" 
					ajax="true" update="kardexList"/>

				<p:spacer height="2" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
					
				<p:defaultCommand target="buscar"/>

			</div>

			<p:dataTable id="kardexList" style="margin-top:10px;" emptyMessage="No se encontro datos"
				value="#{kardexControl.kardexs}" var="_kardex">

				<f:facet name="header">
					<h:outputText value="Productos" />
				</f:facet>

				<p:column style="width:80px;text-align: center" headerText="Operación">

					<p:panelGrid columns="2" styleClass="ui-noborder">

						<p:commandLink styleClass="ui-icon ui-icon-pencil"
							title="Modificar" action="#{kardexControl.modificar}">
							<f:setPropertyActionListener value="#{_kardex.kardexId}"
								target="#{kardexControl.id}" />
						</p:commandLink>

						<p:commandLink styleClass="ui-icon ui-icon-folder-open"
							title="Explorar" action="#{kardexControl.explorar}">
							<f:setPropertyActionListener value="#{_kardex.kardexId}"
								target="#{kardexControl.id}" />
						</p:commandLink>

					</p:panelGrid>

				</p:column>

				<p:column headerText="Id">
					<h:outputText id="kardexId" value="#{_kardex.kardexId}" />
				</p:column>

				<p:column headerText="ProductoId">
					<h:outputText id="productoId" value="#{_kardex.producto.productoId}" />
				</p:column>

			</p:dataTable>
			
			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml" >
				<ui:param name="paginadorControl" value='#{kardexControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
