<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="provGrupId" value='#{provGrupControl.id}' />
		<f:event type="preRenderView" listener="#{provGrupControl.recuperar}" />
	</f:metadata>

	<ui:define name="header">
	</ui:define>

	<ui:define name="main">

		<h:form>

			<div class="barraBotones">
				<p:link id="aceptar" value="Aceptar" outcome="lista"
					styleClass="boton" />
			</div>

			<p:panel id="explora" header="Grupo Proveedor - Explorar">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Descripción" />
							<p:inputText value="#{provGrupControl.provGrup.descri}" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Nota" />
							<p:inputText value="#{provGrupControl.provGrup.nota}" />
						</div>

						<div class="field col-12 md:col-2" style="margin-top: 29px;">
							<p:selectBooleanCheckbox itemLabel="Estado"
								value="#{provGrupControl.provGrup.estado}" />
						</div>
					</div>
				</div>
			</p:panel>
		</h:form>


		<h:form>

			<div class="card product">

				<p:dataView id="provGrupPlanCuenList"
					rendered="#{provGrupControl.rolPermiso.get(4003)}"
					emptyMessage="No se encontro datos"
					value="#{provGrupControl.provGrupPlanCuens}"
					var="_provGrupPlanCuen">

					<f:facet name="header">
						<h:outputText value="Cuentas Contables" />
					</f:facet>

					<p:dataViewListItem>
						<div class="product-list-item">

							<div class="product-list-detail">
								<span class="product-category">#{_provGrupPlanCuen.planCuen.codigo}</span>
								<div class="product-name">#{_provGrupPlanCuen.planCuen.descri}</div>
							</div>

							<div class="product-list-detail">
								#{_provGrupPlanCuen.documento.descri}</div>

							<div class="product-list-detail">
								#{_provGrupPlanCuen.tipoTran}</div>

							<div class="product-list-action">

								<p:commandLink styleClass="ui-icon ui-icon-pencil"
									title="Modificar" action="#{provGrupPlanCuenControl.modificar}">
									<f:setPropertyActionListener
										value="#{_provGrupPlanCuen.pgpcId}"
										target="#{provGrupPlanCuenControl.id}" />
									<f:setPropertyActionListener
										value="#{provGrupControl.provGrup.provGrupId}"
										target="#{provGrupPlanCuenControl.provGrupId}" />
									<f:setPropertyActionListener
										value="/ppsj/ingreso/provGrup/explora"
										target="#{provGrupPlanCuenControl.paginaRuta}" />
								</p:commandLink>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<div class="barraBotones">

				<p:commandLink value="Nuevo" styleClass="boton" ajax="false"
					action="#{provGrupPlanCuenControl.nuevo}">
					<f:setPropertyActionListener
						value="#{provGrupControl.provGrup.provGrupId}"
						target="#{provGrupPlanCuenControl.provGrupId}" />
					<f:setPropertyActionListener value="/ppsj/ingreso/provGrup/explora"
						target="#{provGrupPlanCuenControl.paginaRuta}" />
				</p:commandLink>

			</div>
		</h:form>
	</ui:define>
</ui:composition>
