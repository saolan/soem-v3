<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{provGrupControl.pagina}' />
		<f:event type="preRenderView" listener='#{provGrupControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:focus context="panelBuscar" />
			<p:defaultCommand target="buscar" />

			<div class="barraBotones">

				<p:link value="Nuevo" outcome="registra" styleClass="boton"
					rendered="#{provGrupControl.rolPermiso.get(4000)}" />

				<p:commandLink id="buscar" value="Buscar" styleClass="boton"
					action="#{provGrupControl.iniciarPagina}" ajax="true"
					update="provGrupList" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>

			<p:panel id="panelBuscar" header="Grupo Proveedor - Panel Busqueda">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="descri"
								value="#{provGrupControl.provGrup.descri}" required="false"
								placeholder="Descripción">
								<f:validateBean for="descri" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:selectBooleanCheckbox id="estado" itemLabel="Estado"
								value="#{provGrupControl.provGrup.estado}" required="false">
								<f:validateBean for="estado" disabled="true" />
							</p:selectBooleanCheckbox>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="card product">

				<p:dataView id="provGrupList" emptyMessage="No se encontro datos"
					value="#{provGrupControl.provGrups}" var="_provGrup">

					<f:facet name="header">
						<h:outputText value="Grupos de Proveedores" />
					</f:facet>


					<p:dataViewListItem>
						<div class="product-list-item">

							<div class="product-list-detail">
								<div class="product-name">#{_provGrup.descri}</div>
							</div>

							<div class="product-list-detail">#{_provGrup.nota}</div>

							<div class="product-list-detail">
								<p:outputLabel value="Estado: "></p:outputLabel>
								<h:selectBooleanCheckbox id="estado" value="#{_provGrup.estado}" />
							</div>


							<div class="product-list-action">
								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar" action="#{provGrupControl.modificar}">
										<f:setPropertyActionListener value="#{_provGrup.provGrupId}"
											target="#{provGrupControl.id}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" action="#{provGrupControl.explorar}">
										<f:setPropertyActionListener value="#{_provGrup.provGrupId}"
											target="#{provGrupControl.id}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{provGrupControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
