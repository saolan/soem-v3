<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{persProvControl.pagina}' />
		<f:event type="preRenderView" listener='#{persProvControl.buscar}' />
	</f:metadata>

	<ui:param name="pageTitle" value="Soem - Proveedores Listado" />

	<ui:define name="main">

		<h:form>

			<p:defaultCommand target="buscar" />
			<p:focus context="panelBuscar" />

			<div class="barraBotones">

				<p:commandLink value="Nuevo" styleClass="boton" ajax="false"
					action="#{persProvControl.nuevo}"
					rendered="#{persProvControl.rolPermiso.get(4000)}">
					<f:setPropertyActionListener value="/ppsj/ingreso/persProv/lista"
						target="#{persProvControl.paginaRuta}" />
				</p:commandLink>

				<p:commandLink id="buscar" ajax="false" value="Buscar"
					styleClass="boton" action="#{persProvControl.iniciarPagina}" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>
			
			<p:panel id="panelBuscar" header="Proveedor - Panel Busqueda">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="cedula"
								value="#{persProvControl.persProv.persona.cedulaRuc}"
								required="false" placeholder="Cédula o Ruc">
								<f:validateBean for="cedula" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="apelli"
								value="#{persProvControl.persProv.persona.apelli}"
								required="false" placeholder="Apellido">
								<f:validateBean for="apelli" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="nombre"
								value="#{persProvControl.persProv.persona.nombre}"
								required="false" placeholder="Nombre">
								<f:validateBean for="nombre" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:selectBooleanCheckbox id="estado" itemLabel="Estado"
								value="#{persProvControl.persProv.estado}" required="false">
								<f:validateBean for="estado" disabled="true" />
							</p:selectBooleanCheckbox>
						</div>

					</div>
				</div>
			</p:panel>

			<div class="card product">

				<p:dataView id="persProvList" emptyMessage="No se encontro datos"
					value="#{persProvControl.persProvs}" var="_persProv">

					<f:facet name="header">
						<h:outputText value="Proveedores" />
					</f:facet>

					<p:dataViewListItem>
						<div class="product-list-item">

							<div class="product-list-detail">
								<span class="product-name">#{_persProv.persona.cedulaRuc}</span>
								<div class="product-name">#{_persProv.persona.apelli}
									#{_persProv.persona.nombre}</div>
							</div>

							<div class="product-list-detail">

								<span><i class="pi pi-envelope product-category-icon" />#{_persProv.persona.correo}</span>
								<div></div>

								<p:outputLabel value="Estado: "></p:outputLabel>
								<p:outputLabel value="#{_persProv.estado}">
								</p:outputLabel>
							</div>

							<div class="product-list-action">
								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar" ajax="false"
										action="#{persProvControl.modificar}">
										<f:setPropertyActionListener value="#{_persProv.personaId}"
											target="#{persProvControl.id}" />
										<f:setPropertyActionListener
											value="/ppsj/ingreso/persProv/lista"
											target="#{persProvControl.paginaRuta}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" ajax="false"
										action="#{persProvControl.explorar}">
										<f:setPropertyActionListener value="#{_persProv.personaId}"
											target="#{persProvControl.id}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{persProvControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
