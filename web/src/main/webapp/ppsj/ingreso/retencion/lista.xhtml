<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{retencionControl.pagina}' />
		<f:event type="preRenderView" listener='#{retencionControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:defaultCommand target="buscar" />
			<p:focus context="panelBuscar" />


			<div class="barraBotones">

				<p:link value="Nuevo" outcome="/ppsj/ingreso/retenc/registra"
					styleClass="boton" rendered="false" />

				<p:commandLink id="buscar" value="Buscar" styleClass="boton"
					action="#{retencionControl.iniciarPagina}" ajax="false"
					update="retencionList" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>

			<p:panel id="panelBuscar" header="Retención - Panel Busqueda">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="retencionNumero"
								value="#{retencionControl.retencion.numero}" required="false"
								placeholder="Retención Número">
								<f:validateBean for="numero" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="facturaNumero"
								value="#{retencionControl.retencion.ingreso.numero}"
								required="false" placeholder="Factura Número">
								<f:validateBean for="numero" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:calendar id="fecha" pattern="dd-MM-yyyy"
								value="#{retencionControl.retencion.fechaEmis}" required="false">
								<f:validateBean for="fecha" disabled="true" />
							</p:calendar>
						</div>
					</div>
				</div>
			</p:panel>


			<div class="card product">
				<p:dataView id="retencionList" emptyMessage="No se encontro datos"
					value="#{retencionControl.retencions}" var="_retencion">

					<f:facet name="header">
						<h:outputText value="Retenciones" />
					</f:facet>

					<p:dataViewListItem>

						<div class="product-list-item">
							<div class="product-list-detail">
								#{_retencion.ingreso.persProv.persona.apelli}
								#{_retencion.ingreso.persProv.persona.nombre}
								<div/>
								#{_retencion.serie1}-#{_retencion.serie2}-#{_retencion.numero}
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Doc." style="margin-right:7px"></p:outputLabel>
								#{_retencion.ingreso.serie1}-#{_retencion.ingreso.serie2}-#{_retencion.ingreso.numero}
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Emisión:" style="margin-right:7px"></p:outputLabel>
								<h:outputText id="fechaEmis" value="#{_retencion.fechaEmis}">
									<f:convertDateTime type="localDate" pattern="dd-MM-yyyy" />
								</h:outputText>
								<div/>
								<p:outputLabel value="Registro:" style="margin-right:5px"></p:outputLabel>
								<h:outputText id="fechaRegi" value="#{_retencion.fechaRegi}">
									<f:convertDateTime type="localDate" pattern="dd-MM-yyyy" />
								</h:outputText>
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Estado:" style="margin-right:11px"></p:outputLabel>
								<h:outputText id="estado" value="#{_retencion.estado}" />
								<div/>
								<p:outputLabel value="Doc.Ele:" style="margin-right:5px"></p:outputLabel>
								<h:outputText id="estadoDe" value="#{_retencion.estadoDocuElec}" />
							</div>

							<div class="product-list-action">
								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar" action="#{retencControl.modificar}">
										<f:setPropertyActionListener value="#{_retencion.retencionId}"
											target="#{retencControl.id}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" action="#{retencControl.explorar}">
										<f:setPropertyActionListener value="#{_retencion.retencionId}"
											target="#{retencControl.id}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{retencionControl}' />
			</ui:include>
		</h:form>
	</ui:define>
</ui:composition>
