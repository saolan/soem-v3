<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{ingresoControl.pagina}' />
		<f:event type="preRenderView" listener='#{ingresoControl.buscar}' />
	</f:metadata>

	<ui:param name="pageTitle" value="Soem - Compras Listado" />

	<ui:define name="main">

		<h:form>

			<p:focus context="panelBuscar" />
			<p:defaultCommand target="buscar" />

			<div class="barraBotones">

				<p:link value="Nuevo" outcome="/ppsj/ingreso/compra/compraDeta"
					styleClass="boton"
					rendered="#{ingresoControl.rolPermiso.get(4100)}" />

				<p:commandLink id="buscar" ajax="false" value="Buscar"
					styleClass="boton" action="#{ingresoControl.iniciarPagina}" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>

			<p:panel id="panelBuscar" header="Compras - Busqueda">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="cedulaRuc"
								value="#{ingresoControl.ingreso.persProv.persona.cedulaRuc}"
								required="false" placeholder="Cédula o Ruc">
								<f:validateBean for="cedulaRuc" disabled="true" />
							</p:inputText>
						</div>
						
						<div class="col-12 md:col-2">
							<p:inputText id="apelli"
								value="#{ingresoControl.ingreso.persProv.persona.apelli}"
								required="false" placeholder="Apellido">
								<f:validateBean for="apelli" disabled="true" />
							</p:inputText>
						</div>
						<div class="col-12 md:col-2">
							<p:inputText id="nombre"
								value="#{ingresoControl.ingreso.persProv.persona.nombre}"
								required="false" placeholder="Nombre">
								<f:validateBean for="nombre" disabled="true" />
							</p:inputText>
						</div>
						<div class="col-12 md:col-2">
							<p:inputText id="docuIngr"
								value="#{ingresoControl.ingreso.docuIngr.documento.descri}"
								required="false" placeholder="Documento">
								<f:validateBean for="docuIngr" disabled="true" />
							</p:inputText>
						</div>
						<div class="col-12 md:col-2">
							<p:inputText id="numero" value="#{ingresoControl.ingreso.numero}"
								required="false" placeholder="Número">
								<f:validateBean for="numero" disabled="true" />
							</p:inputText>
						</div>
						<div class="col-12 md:col-2">
							<p:inputText id="secuencial"
								value="#{ingresoControl.ingreso.ingresoId}" required="false"
								placeholder="Secuencial">
								<f:validateBean for="secuencial" disabled="true" />
							</p:inputText>
						</div>
						<div class="col-12 md:col-2">
							<p:calendar id="fecha" pattern="dd-MM-yyyy"
								value="#{ingresoControl.ingreso.fechaEmis}" required="false"
								placeholder="Fecha Emisión">
								<f:validateBean for="fecha" disabled="true" />
							</p:calendar>
						</div>
						<div class="col-12 md:col-2">
							<p:selectOneRadio id="orden" value="#{ingresoControl.orden}">
								<f:selectItems value="#{ingresoControl.ordens}" var="orden"
									itemLabel="#{orden}" itemValue="#{orden}" />
							</p:selectOneRadio>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="card product">

				<p:dataView id="ingresoList" emptyMessage="No se encontro datos"
					value="#{ingresoControl.ingresos}" var="_ingreso">

					<f:facet name="header">
						<h:outputText value="Compras" />
					</f:facet>

					<p:dataViewListItem>

						<div class="product-list-item">
							<div class="product-list-detail">
								<span><i class="pi pi-building" />#{_ingreso.sucursal.descri}</span>
								<div>#{_ingreso.docuIngr.documento.descri} #{_ingreso.serie1}-#{_ingreso.serie2}-#{_ingreso.numero}
									</div>
							</div>

							<div class="product-list-detail">
								<div>#{_ingreso.persProv.persona.apelli}
									#{_ingreso.persProv.persona.nombre}</div>
								<div></div>
								<div>Sec - #{_ingreso.ingresoId}</div>
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Emisión:" style="margin-right:7px"></p:outputLabel>
								<h:outputText id="fechaEmis" value="#{_ingreso.fechaEmis}">
									<f:convertDateTime type="localDate" pattern="dd-MM-yyyy" />
								</h:outputText>
								<div></div>
								<p:outputLabel value="Registro:" style="margin-right:5px"></p:outputLabel>
								<h:outputText id="fechaRegis" value="#{_ingreso.fechaHoraRegi}">
									<f:convertDateTime type="localDate" pattern="dd-MM-yyyy HH:mm" />
								</h:outputText>
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Estado:" style="margin-right:11px"></p:outputLabel>
								<h:outputText id="estado" value="#{_ingreso.estado}" />
								<div></div>
								<p:outputLabel value="Doc.Ele:" style="margin-right:5px"></p:outputLabel>
								<h:outputText id="estadoDe" value="#{_ingreso.estadoDocuElec}" />
							</div>

							<div class="product-list-action">
								<h:outputText id="total" value="#{_ingreso.total}">
									<f:convertNumber pattern="$0.00" locale="en-US" />
								</h:outputText>

								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar" ajax="false"
										action="#{compraControl.modificarIngrDetas}">
										<f:setPropertyActionListener value="#{_ingreso.ingresoId}"
											target="#{compraControl.ingresoId}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" ajax="false"
										action="#{ingresoControl.explorar}">
										<f:setPropertyActionListener value="#{_ingreso.ingresoId}"
											target="#{ingresoControl.id}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{ingresoControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
