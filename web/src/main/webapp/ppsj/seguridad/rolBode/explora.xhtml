<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="rolBodeId" value='#{rolBodeControl.id}' />
		<f:event type="preRenderView" listener="#{rolBodeControl.recuperar}" />
	</f:metadata>

	<ui:define name="header">
	</ui:define>

	<ui:define name="main">

		<h:form>
			<p:panel id="explora" header="Rol Bodega - Panel Explorar"
				style="margin-bottom:10px">

				<h:panelGrid columns="2">
				
					<p:outputLabel value="Sucursal" />
					<p:inputText value="#{rolBodeControl.rolBode.sucursal.descri}" />
				
					<p:outputLabel value="Rol" />
					<p:inputText value="#{rolBodeControl.rolBode.rol.descri}" />
					
					<p:outputLabel value="Bodega" />
					<p:inputText value="#{rolBodeControl.rolBode.bodega.descri}" />
				
					<p:outputLabel value="Predeterminado" />
					<p:selectBooleanCheckbox value="#{rolBodeControl.rolBode.predet}" />
					
					<p:outputLabel value="Acceso" />
					<p:selectBooleanCheckbox value="#{rolBodeControl.rolBode.acceso}" />					
				</h:panelGrid>

			</p:panel>

			<div id="barraBotones">
				<p:link id="aceptar" value="Aceptar" outcome="lista"
					styleClass="boton" />
			</div>
		</h:form>
	</ui:define>
</ui:composition>
