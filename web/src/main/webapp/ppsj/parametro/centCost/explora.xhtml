<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="centCostId" value='#{centCostControl.id}' />
		<f:event type="preRenderView" listener="#{centCostControl.preCargarRegExp}" />
	</f:metadata>

	<ui:define name="header">
	</ui:define>

	<ui:define name="main">

		<h:form>
			<p:panel id="explora" header="Centro de Costo - Explorar" 
				style="margin-bottom:10px">

				<h:panelGrid columns="6" styleClass="noBorders" >

					<p:outputLabel value="Código" />
					<p:inputText value="#{centCostControl.centCost.codigo}" readonly="true" />				

					<p:outputLabel value="Descripción" />
					<p:inputText value="#{centCostControl.centCost.descri}" readonly="true" />
									
					<p:outputLabel value="Estado" />
					<p:inputText value="#{centCostControl.centCost.estado}" readonly="true"  />
					
				</h:panelGrid>

			</p:panel>

			<div id="barraBotones">
				<p:link id="aceptar" value="Aceptar" outcome="lista"
					styleClass="boton" />

			</div>
		</h:form>
	</ui:define>
</ui:composition>
