<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="parametroId" value='#{parametroControl.id}' />
		<f:event type="preRenderView" listener="#{parametroControl.recuperar}" />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:panel id="panelRegistrar" header="Parámetro - Panel Datos"
				style="margin-bottom:10px; ">

				<p:focus for="panelRegistrar"/>

				<h:panelGrid id="grid" columns="2">


					<p:outputLabel for="codigo" value="Código" />
					<p:inputText id="codigo" value="#{parametroControl.parametro.codigo}" styleClass="cajaTextoDescri"
						required="true" requiredMessage="Ingrese código" />

					<p:outputLabel for="descripcion" value="Descripción" />
					<p:inputText id="descripcion" value="#{parametroControl.parametro.descri}" styleClass="cajaTextoDescri" 
						required="true" requiredMessage="Ingrese descripción" />
						
					<p:outputLabel for="parametroId" value="Parámetro Id" />
					<p:inputText id="parametroId" value="#{parametroControl.parametro.parametroId}"  
						required="true" requiredMessage="Ingrese parametro id" />
						

					<p:outputLabel for="estado" value="Estado" />
					<p:selectBooleanCheckbox id="estado" value="#{parametroControl.parametro.estado}" required="true"
						requiredMessage="Ingrese estado" />

				</h:panelGrid>

			</p:panel>

			<div id="barraBotones">

				<p:commandLink id="grabar" value="Grabar" 
					styleClass="boton" action="#{parametroControl.grabar}"
					rendered="#{(parametroControl.id != null and parametroControl.rolPermiso.get(6001)) or 
					(parametroControl.id == null and parametroControl.rolPermiso.get(6000)) }" />

				<p:spacer height="2" />

				<p:commandLink id="eliminar" value="Eliminar" 
					styleClass="boton" action="#{parametroControl.eliminar}"  
					rendered="#{parametroControl.id != null and parametroControl.rolPermiso.get(6002)}"/>

				<p:spacer height="2" />

				<p:link styleClass="boton" type="link" value="Cancelar"
					outcome="lista" />
					
				<p:defaultCommand target="grabar"/>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
