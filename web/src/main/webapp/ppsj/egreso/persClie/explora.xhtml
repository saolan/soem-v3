<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="persClieId" value='#{persClieControl.id}' />
		<f:event type="preRenderView" listener="#{persClieControl.recuperar}" />
	</f:metadata>

	<ui:param name="pageTitle" value="Soem - Cliente Explorar" />

	<ui:define name="header">
	</ui:define>

	<ui:define name="main">

		<h:form>

			<div class="barraBotones">
				<p:link id="aceptar" value="Aceptar" outcome="lista"
					styleClass="boton" />
			</div>

			<p:panel id="explora" header="Cliente - Explorar">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Cédula" />
							<p:inputText
								value="#{persClieControl.persClie.persona.cedulaRuc}"
								readonly="true" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Apellido" />
							<p:inputText value="#{persClieControl.persClie.persona.apelli}"
								readonly="true" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Nombre" />
							<p:inputText value="#{persClieControl.persClie.persona.nombre}"
								readonly="true" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Grupo" />
							<p:inputText value="#{persClieControl.persClie.clieGrup.descri}"
								readonly="true" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Estado" />
							<p:selectBooleanCheckbox
								value="#{persClieControl.persClie.estado}" />
						</div>
					</div>
				</div>

			</p:panel>

		</h:form>
	</ui:define>
</ui:composition>
