<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="persCobrId" value='#{persCobrControl.id}' />
		<f:event type="preRenderView" listener="#{persCobrControl.recuperar}" />
	</f:metadata>

	<ui:define name="header">
	</ui:define>

	<ui:define name="main">

		<div class="barraBotones">

			<p:link id="aceptar" value="Aceptar" outcome="lista"
				styleClass="boton" />
		</div>

		<h:form>

			<p:panel id="explora" header="Cobrador - Panel Explorar">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Cédula" />
							<p:inputText
								value="#{persCobrControl.persCobr.persona.cedulaRuc}" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Apellido" />
							<p:inputText value="#{persCobrControl.persCobr.persona.apelli}" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel value="Nombre" />
							<p:inputText value="#{persCobrControl.persCobr.persona.nombre}" />
						</div>

						<div class="field col-12 md:col-2" style="margin-top: 29px;">
							<p:selectBooleanCheckbox itemLabel="Estado"
								value="#{persCobrControl.persCobr.estado}" />
						</div>
					</div>
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
