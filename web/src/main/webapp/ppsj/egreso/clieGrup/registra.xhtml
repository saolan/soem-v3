<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="clieGrupId" value='#{clieGrupControl.id}' />
		<f:event type="preRenderView" listener="#{clieGrupControl.recuperar}" />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:defaultCommand target="grabar" />
			<p:focus for="panelRegistrar" />

			<div class="barraBotones">

				<p:commandLink id="grabar" value="Grabar" styleClass="boton"
					action="#{clieGrupControl.grabar}"
					rendered="#{(clieGrupControl.id != null and clieGrupControl.rolPermiso.get(3001)) or 
					(clieGrupControl.id == null and clieGrupControl.rolPermiso.get(3000)) }" />

				<p:commandLink id="eliminar" value="Eliminar" styleClass="boton"
					action="#{clieGrupControl.eliminar}"
					rendered="#{clieGrupControl.id != null and clieGrupControl.rolPermiso.get(3002)}" />

				<p:link styleClass="boton" type="link" value="Cancelar"
					outcome="lista" />

			</div>

			<p:panel id="panelRegistrar"
				header="Grupo Cliente - Crear - Modificar">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-2">
							<p:outputLabel for="descri" value="Descripción" />
							<p:inputText id="descri"
								value="#{clieGrupControl.clieGrup.descri}" required="true"
								requiredMessage="Ingrese descripción" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel for="nota" value="Nota" />
							<p:inputText id="nota" value="#{clieGrupControl.clieGrup.nota}" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel for="estado" value="Estado" />
							<p:selectBooleanCheckbox id="estado"
								value="#{clieGrupControl.clieGrup.estado}" required="true"
								requiredMessage="Ingrese estado" />
						</div>
					</div>
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
