<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{persVendControl.pagina}' />
		<f:event type="preRenderView" listener='#{persVendControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:focus context="panelBuscar" />
			<p:defaultCommand target="buscar" />

			<div class="barraBotones">

				<p:commandLink value="Nuevo" styleClass="boton" ajax="false"
					action="#{persVendControl.nuevo}"
					rendered="#{persVendControl.rolPermiso.get(3000)}">
					<f:setPropertyActionListener value="/ppsj/egreso/persVend/lista"
						target="#{persVendControl.paginaRuta}" />
				</p:commandLink>

				<p:commandLink id="buscar" ajax="false" value="Buscar"
					styleClass="boton" action="#{persVendControl.iniciarPagina}" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>

			<p:panel id="panelBuscar" style="margin-bottom:5px"
				header="Vendedor - Panel Busqueda">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="cedula"
								value="#{persVendControl.persVend.persona.cedulaRuc}"
								required="false" placeholder="Cédula o Ruc">
								<f:validateBean for="cedula" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="apelli"
								value="#{persVendControl.persVend.persona.apelli}"
								required="false" placeholder="Apellido">
								<f:validateBean for="apelli" disabled="true" />
							</p:inputText>
						</div>


						<div class="col-12 md:col-2">
							<p:inputText id="nombre"
								value="#{persVendControl.persVend.persona.nombre}"
								required="false" placeholder="Nombre">
								<f:validateBean for="nombre" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:selectBooleanCheckbox id="estado" itemLabel="Estado"
								value="#{persVendControl.persVend.estado}" required="false">
								<f:validateBean for="estado" disabled="true" />
							</p:selectBooleanCheckbox>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="card product">

				<p:dataView id="persVendList" emptyMessage="No se encontro datos"
					value="#{persVendControl.persVends}" var="_persVend">

					<f:facet name="header">
						<h:outputText value="Vendedores" />
					</f:facet>

					<p:dataViewListItem>
						<div class="product-list-item">

							<div class="product-list-detail">#{_persVend.persona.cedulaRuc}</div>

							<div class="product-list-detail">#{_persVend.persona.apelli}
								#{_persVend.persona.nombre}</div>

							<div class="product-list-detail">#{_persVend.persona.correo}</div>

							<div class="product-list-detail">
								<h:selectBooleanCheckbox id="estado"
									value="#{_persVend.estado}" disabled="true" />
							</div>

							<div class="product-list-action">
								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar" ajax="false"
										action="#{persVendControl.modificar}">
										<f:setPropertyActionListener value="#{_persVend.personaId}"
											target="#{persVendControl.id}" />
										<f:setPropertyActionListener
											value="/ppsj/egreso/persVend/lista"
											target="#{persVendControl.paginaRuta}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" ajax="false"
										action="#{persVendControl.explorar}">
										<f:setPropertyActionListener value="#{_persVend.personaId}"
											target="#{persVendControl.id}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{persVendControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
