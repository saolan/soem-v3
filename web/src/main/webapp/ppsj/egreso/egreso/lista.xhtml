<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{egresoControl.pagina}' />
		<f:event type="preRenderView" listener='#{egresoControl.buscar}' />
	</f:metadata>

	<ui:param name="pageTitle" value="Soem - Ventas Listado" />

	<ui:define name="main">

		<h:form id="egresoListaForm">
			<p:focus context="panelBuscar" />
			<p:defaultCommand target="buscar" />

			<div class="barraBotones">
				<p:link value="Nuevo" outcome="/ppsj/egreso/venta/ventaDeta"
					styleClass="boton"
					rendered="#{egresoControl.sesionVentas and egresoControl.rolPermiso.get(3100)}" />

				<p:commandLink id="buscar" ajax="false" value="Buscar"
					styleClass="boton" action="#{egresoControl.iniciarPagina}" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>

			<p:panel id="panelBuscar" header="Ventas - Panel Busqueda">

				<div class="card">

					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="cedulaRuc" placeholder="Cédula o Ruc"
								value="#{egresoControl.egreso.persClie.persona.cedulaRuc}"
								required="false">
								<f:validateBean for="cedulaRuc" disabled="true" />
							</p:inputText>

						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="apelli" placeholder="Apellido"
								value="#{egresoControl.egreso.persClie.persona.apelli}"
								required="false">
								<f:validateBean for="apelli" disabled="true" />
							</p:inputText>

						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="nombre" placeholder="Nombre"
								value="#{egresoControl.egreso.persClie.persona.nombre}"
								required="false">
								<f:validateBean for="nombre" disabled="true" />
							</p:inputText>

						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="docuEgre" placeholder="Documento"
								value="#{egresoControl.egreso.docuEgre.documento.descri}"
								required="false">
								<f:validateBean for="docuEgre" disabled="true" />
							</p:inputText>

						</div>

						<div class="col-12 md:col-4">
							<p:inputText id="numero" placeholder="Número"
								value="#{egresoControl.egreso.numero}" required="false">
								<f:validateBean for="numero" disabled="true" />
							</p:inputText>

						</div>
						<div class="col-12 md:col-2">
							<p:calendar id="fecha" placeholder="Fecha Emisión"
								pattern="dd-MM-yyyy" value="#{egresoControl.egreso.fechaEmis}"
								required="false">
								<f:validateBean for="fecha" disabled="true" />
							</p:calendar>

						</div>

						<div class="col-12 md:col-2">
							<p:selectOneRadio id="estado" layout="grid"
								value="#{egresoControl.egreso.estado}">
								<f:selectItems value="#{egresoControl.parametros}"
									var="parametro" itemLabel="#{parametro.descri}"
									itemValue="#{parametro.descri}" />
							</p:selectOneRadio>

						</div>

						<div class="col-12 md:col-2">
							<p:selectOneRadio id="orden" value="#{egresoControl.orden}"
								layout="grid">
								<f:selectItems value="#{egresoControl.ordens}" var="orden"
									itemLabel="#{orden}" itemValue="#{orden}" />
							</p:selectOneRadio>
						</div>

					</div>
				</div>
			</p:panel>

			<div class="card product">

				<p:dataView id="egresoList" emptyMessage="No se encontro datos"
					value="#{egresoControl.egresos}" var="_egreso">

					<f:facet name="header">
						<h:outputText value="Ventas" />
					</f:facet>

					<p:dataViewListItem>

						<div class="product-list-item">
							<div class="product-list-detail">
								<span><i class="pi pi-building" />#{_egreso.sucursal.descri}</span>
								<div>#{_egreso.docuEgre.documento.descri} #{_egreso.serie1}-#{_egreso.serie2}-#{_egreso.numero}</div>
							</div>

							<div class="product-list-detail">
								<div>#{_egreso.persClie.persona.apelli}
									#{_egreso.persClie.persona.nombre}</div>
								<div></div>
								
							</div>

							<div class="product-list-detail ml-2">
								<p:outputLabel value="Inicio:" style="margin-right:5px"></p:outputLabel>
								<h:outputText id="cajaMoviId"
									value="#{_egreso.cajaMovi.cajaMoviId}">
								</h:outputText>
								<div></div>
								<h:outputText id="Mesa" value="#{_egreso.mesa.descri}"
									rendered="#{egresoControl.activarMesa}" />
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Emisión:" style="margin-right:7px"></p:outputLabel>
								<h:outputText id="fechaEmis" value="#{_egreso.fechaEmis}">
									<f:convertDateTime type="localDate" pattern="dd-MM-yyyy" />
								</h:outputText>
								<div></div>
								<p:outputLabel value="Registro:" style="margin-right:5px"></p:outputLabel>
								<h:outputText id="fechaRegis" value="#{_egreso.fechaHoraRegi}">
									<f:convertDateTime type="localDate" pattern="dd-MM-yyyy HH:mm" />
								</h:outputText>
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Estado:" style="margin-right:11px"></p:outputLabel>
								<h:outputText id="estado" value="#{_egreso.estado}" />
								<div></div>
								<p:outputLabel value="Doc.Ele:" style="margin-right:5px"></p:outputLabel>
								<h:outputText id="estadoDe" value="#{_egreso.estadoDocuElec}" />
							</div>

							<div class="product-list-action">

								<h:outputText id="total" value="#{_egreso.total}">
									<f:convertNumber pattern="$0.00" locale="en-US" />
								</h:outputText>

								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar" ajax="false"
										action="#{ventaControl.modificarEgreDetas}">
										<f:setPropertyActionListener value="#{_egreso.egresoId}"
											target="#{ventaControl.egresoId}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" ajax="false"
										action="#{egresoControl.explorar}">
										<f:setPropertyActionListener value="#{_egreso.egresoId}"
											target="#{egresoControl.id}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-print"
										title="Imprimir" action="#{egresoControl.buscarSaliArchs}"
										ajax="true" update="egresoListaForm:saliArchSele"
										onclick="PF('saliArchDialogo').show();"
										rendered="#{ventaControl.rolPermiso.get(3106)}">
										<f:setPropertyActionListener value="#{_egreso}"
											target="#{egresoControl.egresoSele}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{egresoControl}' />
			</ui:include>


			<p:dialog id="saliArchDg" widgetVar="saliArchDialogo" width="99%"
				header="Imprimir - Descargar - Enviar" modal="true"
				resizable="false">

				<div class="card">
				
					<p:dataTable id="saliArchSele" emptyMessage="No se encontro datos"
						reflow="true" value="#{egresoControl.saliArchs}" var="_saliArch">

						<p:column headerText="Salida" width="50%">
							<h:outputText value="#{_saliArch.salida}" />
						</p:column>

						<p:column headerText="Formato">
							<h:outputText value="#{_saliArch.format}" />
						</p:column>

						<p:column headerText="Impresora">
							<h:outputText value="#{_saliArch.impres}" />
						</p:column>

						<p:column headerText="Predeterminado">
							<p:selectBooleanCheckbox value="#{_saliArch.predet}" />
						</p:column>

					</p:dataTable>
				</div>
				
				<p:commandLink id="aceptarSaliArchDg" styleClass="boton"
					value="Aceptar" ajax="false" action="#{egresoControl.descargar}"
					onclick="PF('saliArchDialogo').hide();" />

				<p:spacer height="2" />

				<p:commandLink id="cancelarConvertirDialogo" ajax="false"
					styleClass="boton" value="Cancelar"
					onclick="PF('saliArchDialogo').hide();" />

			</p:dialog>

		</h:form>
		<!-- Aqui ya o va codigo javascript porque en onClick del boton id=aceptarSaliArchDg se cierra el dialogo -->
	</ui:define>

</ui:composition>
