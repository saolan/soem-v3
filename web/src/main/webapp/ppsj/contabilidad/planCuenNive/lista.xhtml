<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{planCuenNiveControl.pagina}' />
		<f:event type="preRenderView" listener='#{planCuenNiveControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:panel id="panelBuscar" style="margin-bottom:10px"
				header="Plan Cuenta Nivel - Panel Busqueda">

				<p:focus context="panelBuscar"/>

				<h:panelGrid columns="2">

					<p:outputLabel for="descri" value="Descripción" />
					<p:inputText id="descri" value="#{planCuenNiveControl.planCuenNive.descri}" required="false"
						styleClass="cajaTextoDescri">
						<f:validateBean for="descri" disabled="true" />
					</p:inputText>

				</h:panelGrid>

			</p:panel>

			<div id="barraBotones">

				<p:link value="Nuevo" outcome="registra" styleClass="boton"
					rendered="#{planCuenNiveControl.rolPermiso.get(2000)}" />

				<p:spacer height="2" />

				<p:commandLink id="buscar" value="Buscar" styleClass="boton" action="#{planCuenNiveControl.iniciarPagina}" 
					ajax="true" update="planCuenNiveList"/>

				<p:spacer height="2" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
					
				<p:defaultCommand target="buscar"/>

			</div>

			<p:dataTable id="planCuenNiveList" style="margin-top:10px;" emptyMessage="No se encontro datos"
				value="#{planCuenNiveControl.planCuenNives}" var="_planCuenNive">

				<f:facet name="header">
					<h:outputText value="Niveles" />
				</f:facet>

				<p:column style="width:80px;text-align: center" headerText="Operación">

					<p:panelGrid columns="2" styleClass="ui-noborder">

						<p:commandLink styleClass="ui-icon ui-icon-pencil"
							title="Modificar" action="#{planCuenNiveControl.modificar}">
							<f:setPropertyActionListener value="#{_planCuenNive.planCuenNiveId}"
								target="#{planCuenNiveControl.id}" />
						</p:commandLink>

						<p:commandLink styleClass="ui-icon ui-icon-folder-open"
							title="Explorar" action="#{planCuenNiveControl.explorar}">
							<f:setPropertyActionListener value="#{_planCuenNive.planCuenNiveId}"
								target="#{planCuenNiveControl.id}" />
						</p:commandLink>

					</p:panelGrid>

				</p:column>

				<p:column headerText="Descripción">
					<h:outputText id="descri" value="#{_planCuenNive.descri}" />
				</p:column>

				<p:column headerText="Nivel">
					<h:outputText id="nivel" value="#{_planCuenNive.nivel}" />
				</p:column>

			</p:dataTable>
			
			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml" >
				<ui:param name="paginadorControl" value='#{planCuenNiveControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
