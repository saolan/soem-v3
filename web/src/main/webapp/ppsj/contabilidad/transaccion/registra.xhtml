<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="paginaPlanCuen"
			value='#{transaccionControl.paginaPlanCuen}' />

		<f:viewParam name="transaccionId" value='#{transaccionControl.id}' />
		<f:event type="preRenderView"
			listener="#{transaccionControl.recuperar}" />
	</f:metadata>

	<ui:define name="main">

		<h:form id="planCuenRegistra">

			<p:focus for="panelRegistrar" />
			<p:defaultCommand target="buscarPlanCuen" />

			<div class="barraBotones">
				<p:commandLink id="grabar" value="Grabar" styleClass="boton"
					action="#{transaccionControl.grabar}"
					rendered="#{(transaccionControl.id != null and transaccionControl.rolPermiso.get(2101)) or 
					(transaccionControl.id == null and transaccionControl.rolPermiso.get(2100)) }" />

				<p:commandLink id="eliminar" value="Eliminar" styleClass="boton"
					action="#{transaccionControl.eliminar}"
					rendered="#{transaccionControl.id != null and transaccionControl.rolPermiso.get(2102)}" />

				<p:commandLink id="anular" value="Anular" styleClass="boton"
					action="#{transaccionControl.anular}"
					rendered="#{transaccionControl.id != null and 
						transaccionControl.rolPermiso.get(2107) and transaccionControl.transaccion.estado.equals('PR')}" />

				<p:link styleClass="boton" type="link" value="Cancelar"
					outcome="lista" />
			</div>

			<p:panel id="panelRegistrar" header="Transacción - Crea - Modificar">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-2">
							<p:outputLabel for="documentoList" value="Documento" />
							<p:selectOneMenu id="documentoList"
								value="#{transaccionControl.transaccion.docuTran}"
								converter="omnifaces.SelectItemsConverter" required="true"
								requiredMessage="Ingrese Documento">
								<f:selectItems value="#{transaccionControl.docuTrans}"
									var="docuTran" itemLabel="#{docuTran.documento.descri}"
									itemValue="#{docuTran}" />
							</p:selectOneMenu>
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel for="fechaEmis" value="Fecha" />
							<p:calendar id="fechaEmis" pattern="dd-MM-yyyy"
								value="#{transaccionControl.transaccion.fechaEmis}"
								required="true" requiredMessage="Ingrese Fecha">
							</p:calendar>
						</div>

						<div class="field col-12 md:col-4">
							<p:outputLabel for="nota" value="Nota" />
							<p:inputText id="nota"
								value="#{transaccionControl.transaccion.nota}" />
						</div>

						<div class="field col-12 md:col-1">
							<p:outputLabel for="numero" value="Número" />
							<p:inputText id="numero"
								value="#{transaccionControl.transaccion.numero}" disabled="true" />

						</div>

						<div class="field col-12 md:col-1">
							<p:outputLabel for="estado" value="Estado" />
							<p:inputText id="estado"
								value="#{transaccionControl.transaccion.estado}" disabled="true" />
						</div>
					</div>
				</div>
			</p:panel>

			<p:panel id="panelBuscarPlanCuen">

				<h:panelGrid id="gridPlanCuen" columns="3">

					<p:outputLabel for="codigoPlanCuen" value="Buscar&#160;Cuenta" />
					<p:inputText id="codigoPlanCuen"
						value="#{transaccionControl.planCuenBuscar.codigo}">
						<p:ajax
							oncomplete="moverCursorDetalle('planCuenRegistra:codigoPlanCuen','planCuenRegistra:tranDetaList',#{transaccionControl.filasTranDetas})"
							listener="#{transaccionControl.agregarTranDeta}"
							update="tranDetaList,codigoPlanCuen,filasTranDetas" />
					</p:inputText>

					<p:commandLink id="abrirDialogo" style=" font-size: 130%;"
						onclick="PF('seleccionCuenta').show();"
						update="panelBuscarCuenta,planCuenList">
						<h:graphicImage library="img" name="lupa1.png" width="14px" />
					</p:commandLink>

				</h:panelGrid>
			</p:panel>

			<p:dataTable id="tranDetaList" scrollable="true" editable="true"
				editMode="cell" emptyMessage="No se encontro datos" reflow="true"
				value="#{transaccionControl.tranDetas}" var="_tranDeta">

				<f:facet name="header">
					<p:outputLabel value="Detalle Transacción">
					</p:outputLabel>
				</f:facet>

				<p:ajax event="cellEdit"
					listener="#{transaccionControl.modificarCelda}"
					update=":planCuenRegistra:totalDebe,:planCuenRegistra:totalHaber,:planCuenRegistra:diferencia" />

				<p:column style="width:90px" headerText="Op.">

					<div class="link-container">
						<p:commandLink styleClass="ui-icon ui-icon-trash" title="eliminar"
							ajax="true" action="#{transaccionControl.eliminarTranDeta}"
							update="tranDetaList,:planCuenRegistra:totalDebe,:planCuenRegistra:totalHaber,:planCuenRegistra:diferencia,:planCuenRegistra:filasTranDetas ">
							<f:setPropertyActionListener value="#{_tranDeta}"
								target="#{transaccionControl.tranDeta}" />

						</p:commandLink>

						<p:commandLink styleClass="ui-icon ui-icon-comment"
							title="Agregar Nota" ajax="true"
							update="planCuenRegistra:tranDetaDetalle"
							onclick="PF('tranDetaNotaDialogo').show();">
							<f:setPropertyActionListener value="#{_tranDeta}"
								target="#{transaccionControl.tranDeta}" />
						</p:commandLink>
					</div>
				</p:column>

				<p:column headerText="Código">
					<h:outputText id="planCuenCodigo"
						value="#{_tranDeta.planCuen.codigo}" />
				</p:column>

				<p:column headerText="Descripción" style="width:60%;">
					<h:outputText id="planCuenDescri"
						value="#{_tranDeta.planCuen.descri}" />
				</p:column>

				<p:column headerText="Total" style="text-align: right">
					<p:cellEditor>
						<f:facet name="output">
							<h:outputText id="totalOutput" value="#{_tranDeta.total}">
								<f:convertNumber pattern="#0.00" locale="en-US" />
							</h:outputText>
						</f:facet>
						<f:facet name="input">
							<p:inputText id="totalInput" value="#{_tranDeta.total}"
								onblur="moverCursor('planCuenRegistra:tranDetaList:totalInput','planCuenRegistra:codigoPlanCuen')">
								<f:convertNumber pattern="#0.000000" locale="en-US" />
							</p:inputText>
						</f:facet>
					</p:cellEditor>
				</p:column>
			</p:dataTable>

			<p:panel id="panelTotal">

				<div class="card ">
					<div class="formgrid grid">

						<div class="col-12 md:col-3">
							<p:outputLabel for="filasTranDetas" value="Reg."
								style="font-size: 110%;" />
							<p:inputText id="filasTranDetas"
								value="#{transaccionControl.filasTranDetas}" disabled="true" />
						</div>

						<div class="col-12 md:col-3">
							<p:outputLabel for="totalDebe" value="Total&#160;Debe"
								style="font-size: 110%;" />
							<p:inputText id="totalDebe"
								value="#{transaccionControl.totalDebe}" disabled="true"
								style="font-size: 110%;">
								<f:convertNumber pattern="#0.00" locale="en-US" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-3">
							<p:outputLabel for="totalHaber" value="Total&#160;Haber"
								style="font-size: 110%;" />
							<p:inputText id="totalHaber"
								value="#{transaccionControl.totalHabe}" disabled="true"
								style="font-size: 110%;">
								<f:convertNumber pattern="#0.00" locale="en-US" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-3">
							<p:outputLabel for="diferencia" value="Diferencia"
								style="font-size: 110%;" />
							<p:inputText id="diferencia" value="#{transaccionControl.difere}"
								disabled="true" style="font-size: 110%;">
								<f:convertNumber pattern="#0.00" locale="en-US" />
							</p:inputText>
						</div>
					</div>
				</div>
			</p:panel>

			<p:dialog widgetVar="seleccionCuenta" width="99%"
				header="Plan De Cuentas" fitViewport="true" modal="true"
				resizable="false" focus="codigo">

				<p:focus context="panelBuscarCuenta" />

				<p:commandLink id="buscarPlanCuen" value="Buscar" styleClass="boton"
					action="#{transaccionControl.buscarPlanCuens(0)}"
					update="planCuenList,panelBuscarCuenta,paginadorPlanCuens" />

				<p:panel id="panelBuscarCuenta">

					<div class="card ui-fluid">
						<div class="formgrid grid">

							<div class="field col-12 md:col-2">
								<p:inputText id="codigo"
									value="#{transaccionControl.planCuenBuscar.codigo}"
									required="false" placeholder="Código">
									<f:validateBean for="codigo" disabled="true" />
								</p:inputText>
							</div>

							<div class="field col-12 md:col-2">
								<p:inputText id="descri" placeholder="Descripción"
									value="#{transaccionControl.planCuenBuscar.descri}"
									required="false" styleClass="cajaTextoDescri">
									<f:validateBean for="descri" disabled="true" />
								</p:inputText>
							</div>
						</div>
					</div>
				</p:panel>

				<p:dataTable id="planCuenList" emptyMessage="No se encontro datos"
					selectionMode="single" rowKey="#{_planCuen.planCuenId}"
					value="#{transaccionControl.planCuens}" var="_planCuen">

					<p:ajax event="rowSelect"
						listener="#{transaccionControl.onRowSelect}"
						oncomplete="moverCursorDetalle('planCuenRegistra:codigoPlanCuen','planCuenRegistra:tranDetaList',#{transaccionControl.filasTranDetas})"
						update="planCuenRegistra:tranDetaList,:planCuenRegistra:totalDebe,:planCuenRegistra:totalHaber,:planCuenRegistra:diferencia,planCuenRegistra:filasTranDetas,planCuenRegistra:codigoPlanCuen" />

					<p:column headerText="Código" style="text-align:left">
						<h:outputText id="codigo" value="#{_planCuen.codigo}" />
					</p:column>

					<p:column headerText="Descripción" style="text-align:left">
						<h:outputText id="descri" value="#{_planCuen.descri}" />
					</p:column>

				</p:dataTable>

				<div align="center">

					<h:panelGroup id="paginadorPlanCuens">

						<p:commandButton value="Anterior" ajax="true"
							update="planCuenRegistra:planCuenList,panelBuscarCuenta,paginadorPlanCuens"
							rendered="#{transaccionControl.paginaPlanCuen gt 0}"
							action="#{transaccionControl.buscarPlanCuens(1)}">
							<f:param name="paginaPlanCuen"
								value="#{transaccionControl.paginaPlanCuen - 1}" />
						</p:commandButton>

						<p:commandButton value="Siguiente" ajax="true"
							update="planCuenRegistra:planCuenList,panelBuscarCuenta,paginadorPlanCuens"
							rendered="#{(transaccionControl.paginaPlanCuen + 1) * transaccionControl.filasPagina lt transaccionControl.contadorRegPlanCuen}"
							action="#{transaccionControl.buscarPlanCuens(1)}">
							<f:param name="paginaPlanCuen"
								value="#{transaccionControl.paginaPlanCuen + 1}" />
						</p:commandButton>

					</h:panelGroup>

				</div>
			</p:dialog>

			<p:dialog id="tranDetaNota" widgetVar="tranDetaNotaDialogo"
				fitViewport="true" width="99%" header="Nota" modal="true"
				resizable="false">

				<p:outputPanel id="tranDetaDetalle" style="text-align:center;">

					<p:panelGrid columns="1" layout="grid">
						<h:outputText
							value="#{transaccionControl.tranDeta.planCuen.descri}" />

						<p:inputTextarea rows="10" cols="43" counter="contador"
							maxlength="1000" counterTemplate="Caracteres disponibles {0}"
							autoResize="false" value="#{transaccionControl.tranDeta.nota}">
						</p:inputTextarea>

						<h:outputText id="contador" />
						<br />
						<p:commandLink id="aceptarTranDetaNotaDialogo" ajax="false"
							styleClass="boton" value="Aceptar"
							onclick="PF('tranDetaNotaDialogo').hide();" />

					</p:panelGrid>

				</p:outputPanel>
			</p:dialog>


			<script type="text/javascript">
		
	        function moverCursor(desde, hasta) {
	        	
				if (desde != hasta){
		        	document.getElementById(hasta).click();
		        	document.getElementById(hasta).focus();
				}		       
	        }

	        function moverCursorDetalle(desde, hasta, filas) {

	        	//filas = filas - 1;
	        	var destino = hasta + ":" + filas + ":totalInput"

				//alert(filas);
	        	
				if (document.getElementById(destino) ){
		        	document.getElementById(destino).click();
		        	document.getElementById(destino).focus();
				}		       
	        	
	        }
	        
		</script>

		</h:form>
	</ui:define>
</ui:composition>
