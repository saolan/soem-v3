<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="tranPlanId" value='#{tranPlanControl.id}' />
		<f:event type="preRenderView" listener="#{tranPlanControl.recuperar}" />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:defaultCommand target="grabar" />
			<p:focus for="panelRegistrar" />

			<div class="barraBotones">

				<p:commandLink id="grabar" value="Grabar" styleClass="boton"
					action="#{tranPlanControl.grabar}"
					rendered="#{(tranPlanControl.id != null and tranPlanControl.rolPermiso.get(2001)) or 
					(tranPlanControl.id == null and tranPlanControl.rolPermiso.get(2000)) }" />

				<p:commandLink id="eliminar" value="Eliminar" styleClass="boton"
					action="#{tranPlanControl.eliminar}"
					rendered="#{tranPlanControl.id != null and tranPlanControl.rolPermiso.get(2002)}" />

				<p:link styleClass="boton" type="link" value="Cancelar"
					outcome="lista" />
			</div>

			<p:panel id="panelRegistrar"
				header="Transacción Plantilla - Crear - Modificar">

				<div class="card ui-fluid">
					<div class="formgrid grid">

						<div class="field col-12 md:col-2">
							<p:outputLabel for="descripcion" value="Descripción" />
							<p:inputText id="descripcion"
								value="#{tranPlanControl.tranPlan.descri}"
								styleClass="cajaTextoDescri" required="true"
								requiredMessage="Ingrese Descripción" />
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel for="moduloList" value="Módulo" />
							<p:selectOneMenu id="moduloList"
								value="#{tranPlanControl.tranPlan.modulo}" required="true">
								<f:selectItem itemLabel="PAGOS" itemValue="PAGOS" />
								<f:selectItem itemLabel="COBROS" itemValue="COBROS" />
							</p:selectOneMenu>
						</div>

						<div class="field col-12 md:col-2">
							<p:outputLabel for="tipoList" value="Tipo" />
							<p:selectOneMenu id="tipoList"
								value="#{tranPlanControl.tranPlan.tipo}" required="true">
								<f:selectItem itemLabel="CXC" itemValue="CXC" />
								<f:selectItem itemLabel="CXP" itemValue="CXP" />
								<f:selectItem itemLabel="GASTO" itemValue="GASTO" />
								<f:selectItem itemLabel="NINGUNO" itemValue="NINGUNO" />
							</p:selectOneMenu>
						</div>

						<div class="field col-12 md:col-2" style="margin-top: 29px;">
							<p:selectBooleanCheckbox id="estado" itemLabel="Estado"
								value="#{tranPlanControl.tranPlan.estado}" required="true"
								requiredMessage="Ingrese estado" />
						</div>
					</div>
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
