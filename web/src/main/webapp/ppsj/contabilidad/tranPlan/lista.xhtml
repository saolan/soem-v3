<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{tranPlanControl.pagina}' />
		<f:event type="preRenderView" listener='#{tranPlanControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:focus context="panelBuscar" />
			<p:defaultCommand target="buscar" />

			<div class="barraBotones">

				<p:link value="Nuevo" outcome="/ppsj/contabilidad/tranPlan/registra"
					styleClass="boton"
					rendered="#{tranPlanControl.rolPermiso.get(2000)}" />

				<p:commandLink id="buscar" value="Buscar" styleClass="boton"
					action="#{tranPlanControl.iniciarPagina}" ajax="false"
					update="tranPlanList" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>

			<p:panel id="panelBuscar"
				header="Transacción Plantilla - Panel Busqueda">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">
							<p:inputText id="descri"
								value="#{tranPlanControl.tranPlan.descri}" required="false"
								placeholder="Descripción">
								<f:validateBean for="numero" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="modulo"
								value="#{tranPlanControl.tranPlan.modulo}" required="false"
								placeholder="Módulo">
								<f:validateBean for="numero" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:selectBooleanCheckbox id="estado" itemLabel="Estado"
								value="#{tranPlanControl.tranPlan.estado}" required="false">
								<f:validateBean for="estado" disabled="true" />
							</p:selectBooleanCheckbox>
						</div>
					</div>
				</div>
			</p:panel>

			<div class="card product">

				<p:dataView id="tranPlanList" emptyMessage="No se encontro datos"
					value="#{tranPlanControl.tranPlans}" var="_tranPlan">

					<f:facet name="header">
						<h:outputText value="Transacción Plantillas" />
					</f:facet>

					<p:dataViewListItem>
						<div class="product-list-item">

							<div class="product-list-detail">
								<div>#{_tranPlan.descri}</div>
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Módulo: "></p:outputLabel>
								#{_tranPlan.modulo}
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Tipo: "></p:outputLabel>
								#{_tranPlan.tipo}
							</div>

							<div class="product-list-action">
								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar" action="#{tranPlanControl.modificar}">
										<f:setPropertyActionListener value="#{_tranPlan.tranPlanId}"
											target="#{tranPlanControl.id}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" action="#{tranPlanControl.explorar}">
										<f:setPropertyActionListener value="#{_tranPlan.tranPlanId}"
											target="#{tranPlanControl.id}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>

				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{tranPlanControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
