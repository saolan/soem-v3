<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/soemTemplate.xhtml">

	<f:metadata>
		<f:viewParam name="pagina" value='#{formPagoMoviIngrControl.pagina}' />
		<f:event type="preRenderView"
			listener='#{formPagoMoviIngrControl.buscar}' />
	</f:metadata>

	<ui:define name="main">

		<h:form>

			<p:defaultCommand target="buscar" />
			<p:focus context="panelBuscar" />

			<div class="barraBotones">

				<p:link value="Nuevo" outcome="registra" styleClass="boton"
					rendered="#{formPagoMoviIngrControl.rolPermiso.get(8100)}" />

				<p:commandLink id="buscar" value="Buscar" styleClass="boton"
					action="#{formPagoMoviIngrControl.iniciarPagina}" ajax="false"
					update="formPagoMoviIngrList" />

				<p:link value="Cancelar" outcome="lista" includeViewParams="false"
					styleClass="boton" />
			</div>

			<p:panel id="panelBuscar" header="Pago - Depósito">

				<div class="card">
					<div class="grid ui-fluid">

						<div class="col-12 md:col-2">

							<p:inputText id="cedulaRuc"
								value="#{formPagoMoviIngrControl.formPagoMoviIngr.persona.cedulaRuc}"
								required="false" placeholder="Cedúla o Ruc">
								<f:validateBean for="cedulaRuc" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="apelli"
								value="#{formPagoMoviIngrControl.formPagoMoviIngr.persona.apelli}"
								required="false" placeholder="Apellido">
								<f:validateBean for="apelli" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="nombre"
								value="#{formPagoMoviIngrControl.formPagoMoviIngr.persona.nombre}"
								required="false" placeholder="Nombre">
								<f:validateBean for="nombre" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:inputText id="numero"
								value="#{formPagoMoviIngrControl.formPagoMoviIngr.numero}"
								required="false" placeholder="Número">
								<f:validateBean for="numero" disabled="true" />
							</p:inputText>
						</div>

						<div class="col-12 md:col-2">
							<p:calendar id="fecha"
								value="#{formPagoMoviIngrControl.formPagoMoviIngr.fecha}"
								pattern="dd-MM-yyyy" required="false">
								<f:validateBean for="fecha" disabled="true" />
							</p:calendar>
						</div>
					</div>
				</div>
			</p:panel>


			<div class="card product">

				<p:dataView id="formPagoMoviIngrList"
					emptyMessage="No se encontro datos"
					value="#{formPagoMoviIngrControl.formPagoMoviIngrs}"
					var="_formPagoMoviIngr">

					<f:facet name="header">
						<h:outputText value="Pagos" />
					</f:facet>

					<p:dataViewListItem>

						<div class="product-list-item">

							<div class="product-list-detail">
								<div class="product-name">#{_formPagoMoviIngr.docuMoviIngr.documento.descri}
									- #{_formPagoMoviIngr.numero}</div>
								<span>#{_formPagoMoviIngr.persona.apelli}
									#{_formPagoMoviIngr.persona.nombre}</span>
							</div>

							<div class="product-list-detail">
								<div>#{_formPagoMoviIngr.formPago.descri}</div>
							</div>

							<div class="product-list-detail">
								<p:outputLabel value="Emisión:" style="margin-right:7px"></p:outputLabel>
								<h:outputText value="#{_formPagoMoviIngr.fecha}">
									<f:convertDateTime type="localDate" pattern="dd-MM-yyyy" />
								</h:outputText>
								<div></div>
								<p:outputLabel value="Registro:" style="margin-right:5px"></p:outputLabel>
								<h:outputText value="#{_formPagoMoviIngr.fechaHoraRegi}">
									<f:convertDateTime type="localDate" pattern="dd-MM-yyyy HH:MM" />
								</h:outputText>
							</div>

							<div class="product-list-detail">
								<h:outputText value="#{_formPagoMoviIngr.total}">
									<f:convertNumber pattern="$0.00" locale="en-US" />
								</h:outputText>
							</div>

							<div class="product-list-action">

								<h:outputText id="estado" value="#{_formPagoMoviIngr.estado}" />

								<div class="link-container">
									<p:commandLink styleClass="ui-icon ui-icon-pencil"
										title="Modificar"
										action="#{formPagoMoviIngrControl.modificar}">
										<f:setPropertyActionListener
											value="#{_formPagoMoviIngr.fpmiId}"
											target="#{formPagoMoviIngrControl.id}" />
									</p:commandLink>

									<p:commandLink styleClass="ui-icon ui-icon-folder-open"
										title="Explorar" action="#{formPagoMoviIngrControl.explorar}">
										<f:setPropertyActionListener
											value="#{_formPagoMoviIngr.fpmiId}"
											target="#{formPagoMoviIngrControl.id}" />
									</p:commandLink>
								</div>
							</div>
						</div>
					</p:dataViewListItem>
				</p:dataView>
			</div>

			<ui:include src="/WEB-INF/facelets/templates/paginador.xhtml">
				<ui:param name="paginadorControl" value='#{formPagoMoviIngrControl}' />
			</ui:include>
		</h:form>
	</ui:define>

</ui:composition>
